defaults:
  - datasets: data2025
  - models: lightgbm
  - experiments: alpha_tuning_exp3_hpp

project_root: "${hydra:runtime.cwd}"
seed: 42

hydra:
  job_logging:
    version: 1
    root:
      level: INFO
      handlers: [console, file]
  hydra_logging:
    level: INFO

results:
  save_path: "reports/${experiments.experiment_name}/${models.model_name}/${datasets.dataset_name}/"
