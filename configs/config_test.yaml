defaults:
  - datasets: data2025
  - models: logistic_regression
  - experiments: 2025_test
  - _self_

seed: 42

hydra:
  job_logging:
    version: 1
    root:
      level: INFO
      handlers: [console, file]
  hydra_logging:
    level: INFO

results:
  save_path: "reports/${experiments.experiment_name}/${models.model_name}/${datasets.dataset_name}/${experiments.optimization_parameters.model}${cvar_path:${experiments.optimization_parameters.use_cvar_constraint},${experiments.optimization_parameters.cvar_limit}}/"
