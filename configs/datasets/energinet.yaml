dataset_name: "energinet"

validation:
  enabled: true
  thresholds:
    missing_warn_pct: 1.0
    missing_fail_pct: 5.0
    duplicate_warn_pct: 1.0
    duplicate_fail_pct: 5.0

start_date: "2023-01-01T00:00"
end_date: "2026-03-02T00:00"
savepath: "data/raw/energinet/"

requests:
  ImbalancePrice:
    start: ${datasets.start_date}
    end: ${datasets.end_date}
    columns: ["TimeUTC", "BalancingDemand", "ImbalancePriceEUR", "SpotPriceEUR"]
    filter:
      PriceArea: "DK1"
    sort: ["TimeUTC"]
