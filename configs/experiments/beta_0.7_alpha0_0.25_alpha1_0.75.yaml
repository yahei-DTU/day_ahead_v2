# Experiment configuration for Exp1
experiment_name: "beta_0.7_alpha0_0.25_alpha1_0.75" # Name of the experiment

# Train parameters
train_parameters:
  train_length: 120 # Days of training
  valid_length: 30 # Days of validation
  test_length: 7 # Days of testing
  n_jobs: 5 # or -1 for all cores
  feature_selection: true # Whether to perform feature selection
  sample_weighting: true # Whether to weight training samples by abs(lambda_DA_hat - lambda_B_hat)
  deadband_quantiles: [0.0] # Quantile of lowest-spread training samples to drop; 0.0 = no deadband

# Model parameters
experiment_parameters:
  start_date: "2025-04-01" # Start date for training
  end_date: "2026-01-31" # End date for testing 2026-01-31
  # decision_threshold_alphas: [0.7, 0.75, 0.8, 0.85] # Symmetric fallback (used only if the two asymmetric lists below are absent)
  decision_threshold_alphas_0: [0.25] # Lower thresholds in [0, 0.5]; predict class 0 if P(class 1) <= alpha_0
  decision_threshold_alphas_1: [0.75] # Upper thresholds in [0.5, 1.0]; predict class 1 if P(class 1) >= alpha_1
  threshold_alpha_tuning: mean_profit # Metric to use for tuning the decision threshold (e.g., "accuracy", "mean_profit", "cvar_profit")
  scoring_metric: "roc_auc" # Metric to use for hyperparameter tuning (e.g., "accuracy", "f1_score", "roc_auc")
  mode: "full" # Mode of operation (e.g., "full", "classif_only")

# Optimization parameters
optimization_parameters:
  portfolio: "hpp" # Portfolio configuration (e.g., "wind_only", "hpp")
  model: class_policy # Optimization model to use (e.g., "class_policy", "all_or_nothing", "hindsight")
  electrolyzer_capacity: 3.6 # MW, set to 0 to disable electrolyzer
  wind_capacity: 7.2 # MW
  hydrogen_price: 2.0 # EUR/kg
  electrolyzer_load_min: 0.1 # Minimum load factor for the electrolyzer (10% of capacity)
  number_of_segments: 2 # Number of linear segments for the hydrogen production function
  a: [] # Linear segments of hydrogen production function (kg/MWh)
  b: []
  minimum_daily_hydrogen: 100 # Minimum daily hydrogen production requirement (kg)
  cvar_alpha: 0.95 # Confidence level for CVaR
  cvar_beta: 0.7 # Weight on expected profit and CVaR in the objective function (1.0 = only maximize expected profit, 0.0 = only maximize CVaR)

feature_selection_parameters:
  shap_cumulative_importance_threshold: 0.6 # Threshold for cumulative importance in SHAP feature selection
  plot_shap_importance: true # Whether to plot SHAP feature importance
