defaults:
  - datasets: data2025
  - models: lightgbm
  - experiments: template_dev
  - _self_

project_root: "${hydra:runtime.cwd}"
seed: 42

hydra:
  job_logging:
    version: 1
    root:
      level: DEBUG
      handlers: [console]
  hydra_logging:
    level: DEBUG

results:
  save_path: "reports/${experiments.experiment_name}/${models.model_name}/${datasets.dataset_name}/"
